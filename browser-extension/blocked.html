<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumen Focus</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: radial-gradient(ellipse at 50% 30%, #1b2a5c, #0b1633 70%); color: #fff;
    display: grid; place-items: center; text-align: center; }
  .box { max-width: 460px; padding: 24px; }
  svg { width: 170px; height: 170px; }
  .float { animation: f 3s ease-in-out infinite; } @keyframes f { 50% { transform: translateY(-6px); } }
  .page { transform-box: fill-box; transform-origin: left center; animation: p 6s ease-in-out infinite; }
  @keyframes p { 0%, 80%, 100% { transform: scaleX(1); } 90% { transform: scaleX(-1); opacity: .5; } }
  .glow { animation: g 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes g { 50% { opacity: .7; transform: scale(.92); } }
  h1 { font-size: 28px; margin: 8px 0; }
  p { color: #c9d2ee; font-size: 16px; line-height: 1.5; margin: 6px 0; }
  .btn { display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 99px; border: 0; background: #F4B942; color: #1b1300;
    font: 600 16px system-ui, sans-serif; cursor: pointer; text-decoration: none; }
  .done h1 { color: #9be7a6; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style></head>
<body><div class="box" id="box">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <defs><radialGradient id="g"><stop offset="0" stop-color="#FFF4A8" stop-opacity=".9"/><stop offset=".45" stop-color="#E9F56A" stop-opacity=".35"/><stop offset="1" stop-color="#E9F56A" stop-opacity="0"/></radialGradient>
      <radialGradient id="t" cx=".5" cy=".4"><stop offset="0" stop-color="#FFFBD0"/><stop offset=".6" stop-color="#F4E84E"/><stop offset="1" stop-color="#A9DB3A"/></radialGradient>
      <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B68C8"/><stop offset="1" stop-color="#5A4AA6"/></linearGradient></defs>
    <circle class="glow" cx="60" cy="80" r="42" fill="url(#g)"/>
    <g class="float">
      <ellipse cx="40" cy="58" rx="17" ry="11" fill="#DDEBFF" fill-opacity=".8"/><ellipse cx="80" cy="58" rx="17" ry="11" fill="#DDEBFF" fill-opacity=".8"/>
      <ellipse cx="60" cy="84" rx="17" ry="15" fill="url(#t)"/>
      <path d="M52 32q-6-12-12-14M68 32q6-12 12-14" fill="none" stroke="#5A4AA6" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="40" cy="18" r="3.2" fill="#F4E84E"/><circle cx="80" cy="18" r="3.2" fill="#F4E84E"/>
      <circle cx="60" cy="50" r="23" fill="url(#b)"/><ellipse cx="60" cy="58" rx="13" ry="9" fill="#8F7FD8" opacity=".55"/>
      <circle cx="45" cy="57" r="4" fill="#FF9FC6" opacity=".7"/><circle cx="75" cy="57" r="4" fill="#FF9FC6" opacity=".7"/>
      <ellipse cx="51" cy="48" rx="5.5" ry="6.5" fill="#fff"/><ellipse cx="69" cy="48" rx="5.5" ry="6.5" fill="#fff"/>
      <circle cx="52" cy="51" r="3.2" fill="#241A4A"/><circle cx="70" cy="51" r="3.2" fill="#241A4A"/>
      <g><path d="M41 66q9.5-5 19 0v16q-9.5-5-19 0z" fill="#F7F1E3" stroke="#C9B48A"/><path d="M79 66q-9.5-5-19 0v16q9.5-5 19 0z" fill="#FFFBF0" stroke="#C9B48A"/>
        <path class="page" d="M60 66q8-4 16-1v16q-8-3-16 1z" fill="#FFFDF6" stroke="#D9C9A4" stroke-width=".7"/><rect x="38" y="81" width="44" height="3" rx="1.5" fill="#E07A5F"/></g>
    </g>
  </svg>
  <h1 id="h"></h1><p id="p"></p><p id="q"></p>
  <a class="btn" id="go" href="#"></a>
</div>
<script src="sites.js"></script>
<script src="blocked.js"></script>
</body></html>
